[package]
name = "gelcorp-launcher"
version = "1.0.10"
description = "Gelcorp Launcher"
authors = ["MonkeyKiller"]
license = ""
repository = ""
edition = "2024"

[lib]
name = "gelcorp_launcher_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
dotenv-build = "0.1.1"

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
regex = "1.13.1"
uuid = { version = "1.24.0", features = [
  "v3",
  "serde",
], default-features = false }
reqwest = { version = "0.12.26", features = ["stream"] }
sha1 = "0.10.6"
hex = { version = "0.4.3", features = ["serde"] }
tokio = { version = "1.53.1", features = ["full"] }
minecraft-msa-auth = "0.4.0"
oauth2 = "4.4.2"
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.33"
thiserror = "2.0.19"
derive_builder = "0.20.2"
zip = "0.6.6"
async-recursion = "1.0.5"
forge-downloader = { git = "https://github.com/Gelcorp/forge-downloader.git", rev = "205c46b" } # { path = "../../forge-downloader" }
minecraft-launcher-core = { git = "https://github.com/MMonkeyKiller/minecraft-launcher-core.git", rev = "25f4022" } # { path = "../../minecraft-launcher-core" }
gelcorp-modpack = { git = "https://github.com/Gelcorp/gelcorp-modpack.git", rev = "b023dde", default-features = false, features = [
  "install",
] }
log4rs = { version = "1.4.0", features = ["gzip"] }
log = "0.4.33"
anyhow = "1.0.104"
once_cell = "1.21.4"
rsa = { version = "0.9.10", features = ["sha2"] }
cbc = "0.1.2"
aes = "0.8.3"
sysinfo = "0.39.6"
flate2 = "1.1.9"
expand_str = "0.1.1"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.10.1"
